<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Contraseña - MSComanda</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">

  <!-- Logo de Marca (contraseñaolvidada.png) -->
  <div class="auth-brand-header">
    <div class="auth-brand-logo">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
        <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
        <line x1="6" y1="1" x2="6" y2="4"></line>
        <line x1="10" y1="1" x2="10" y2="4"></line>
        <line x1="14" y1="1" x2="14" y2="4"></line>
      </svg>
      <span>MS <span class="brand-highlight">Comanda</span></span>
    </div>
  </div>

  <!-- Tarjeta de Recuperar Contraseña -->
  <div class="auth-card">
    <p class="auth-subtitle" style="text-align: center; margin-bottom: 1.75rem;">
      Ingresa tu número de documento o correo registrado para restablecer tu acceso al sistema.
    </p>

    <form class="auth-form" onsubmit="event.preventDefault(); alert('Se han enviado las instrucciones a tu correo o celular registrado.'); window.location.href='login.html';">
      <div class="form-group">
        <label class="form-label">Cédula o Correo Electrónico</label>
        <input type="text" class="form-control" placeholder="Ej. 1098765432 o admin@mscomanda.app" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="margin-top: 0.5rem; padding: 0.85rem;">
        Enviar instrucciones
      </button>

      <div class="auth-footer-text">
        <a href="login.html" class="auth-link">← Volver al inicio de sesión</a>
      </div>
    </form>
  </div>

</body>
</html>
