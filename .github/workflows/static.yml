# Workflow para desplegar contenido estático en GitHub Pages
name: Deploy static content to Pages

on:
  # Se ejecuta automáticamente en cada push a la rama main
  push:
    branches: ["main"]

  # Permite ejecutarlo manualmente desde la pestaña Actions si se desea
  workflow_dispatch:

# Configurar permisos para el token de GITHUB_TOKEN para permitir despliegue en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permitir un solo despliegue concurrente a la vez
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Subir todo el directorio raíz del repositorio (donde está index.html)
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
